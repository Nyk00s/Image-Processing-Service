

services:

  api:
    build: .
    env_file: .env
    container_name: $IMAGE_API_CONTAINER_NAME
    ports:
      - "${IMAGE_API_PORT}:${IMAGE_API_PORT}"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${IMAGE_API_PORT}"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: $DB_CONTAINER_NAME
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    expose:
      - "${DB_PORT}"
    volumes: 
      - "postgres_data:/var/lib/postgresql/18/docker"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    image: redis:7
    container_name: $CACHE_CONTAINER_NAME
    expose:
      - "${CACHE_PORT}"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: $STORAGE_CONTAINER_NAME
    ports:
      - "${STORAGE_PORT}:${STORAGE_PORT}"
      - "${CONSOLE_STORAGE_PORT}:${CONSOLE_STORAGE_PORT}"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":${CONSOLE_STORAGE_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${STORAGE_PORT}/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    env_file: .env
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    

volumes:
  postgres_data:
  redis_data:
  minio_data: